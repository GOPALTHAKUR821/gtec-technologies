<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — G TEC TECHNOLOGEIES</title><style>body{font-family:Arial,sans-serif;background:#f4f7f9;color:#142b3a;margin:0}.wrap{max-width:850px;margin:40px auto;padding:16px}.card{background:#fff;border:1px solid #dce4e8;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,.06)}h1{margin-top:0}.row{display:grid;grid-template-columns:1fr auto;gap:10px}input{width:100%;padding:13px;border:1px solid #cfd9df;border-radius:9px;font-size:16px;box-sizing:border-box}button{padding:13px 18px;border:0;border-radius:9px;background:#f0b52b;font-weight:800;cursor:pointer}.order{border:1px solid #e1e7ea;border-radius:12px;padding:16px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f7f9fa;padding:11px;border-radius:9px}.label{font-size:11px;color:#687780}.value{font-weight:800;margin-top:3px;word-break:break-word}.status{display:inline-block;padding:7px 10px;border-radius:999px;background:#eaf7ee;color:#18794e;font-weight:800}@media(max-width:650px){.row,.grid{grid-template-columns:1fr}button{width:100%}}</style></head><body><main class="wrap"><div class="card"><h1>Track Your Order</h1><p>Apna wahi 10-digit mobile number enter karein jo order me diya tha.</p><div class="row"><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><button onclick="track()">Track Order</button></div><p id="msg" style="color:#b42318"></p></div><div id="results"></div></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}async function track(){const phone=$('phone').value.replace(/\D/g,'');$('msg').textContent='';$('results').innerHTML='';try{const r=await fetch('/api/track-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to track order');const orders=d.orders||[];if(!orders.length){$('results').innerHTML='<div class="card"><b>No order found</b><p>Is mobile number se koi order nahi mila.</p></div>';return}$('results').innerHTML=orders.map(o=>`<div class="card order"><h2>${esc(o.id)}</h2><p><span class="status">${esc(o.trackingLabel||o.status)}</span></p><div class="grid"><div class="item"><div class="label">Order Date</div><div class="value">${esc(o.date)}</div></div><div class="item"><div class="label">Products</div><div class="value">${esc(o.products)}</div></div><div class="item"><div class="label">Payment</div><div class="value">${esc(o.payment)}</div></div><div class="item"><div class="label">Total</div><div class="value">₹${Number(o.total||0).toLocaleString('en-IN')}</div></div><div class="item"><div class="label">Courier Company</div><div class="value">${o.courierCompany?esc(o.courierCompany):'Not assigned yet'}</div></div><div class="item"><div class="label">E-Way Number</div><div class="value">${o.ewayNumber?esc(o.ewayNumber):'Not assigned yet'}</div></div><div class="item"><div class="label">Shipping From</div><div class="value">${esc(o.shippingFrom||'-')}</div></div><div class="item"><div class="label">Last Status Update</div><div class="value">${o.statusUpdatedAt?new Date(o.statusUpdatedAt).toLocaleString('en-IN'):'-'}</div></div></div></div>`).join('')}catch(e){$('msg').textContent=e.message}}$('phone').addEventListener('keydown',e=>{if(e.key==='Enter')track()});</script></body></html>
