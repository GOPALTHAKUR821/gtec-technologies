<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G TEC TECHNOLOGEIES — Admin Login</title>
<style>
:root{--navy:#142b3a;--amber:#f0b52b;--bg:#eef3f6;--line:#d7e0e5;--red:#b42318;--green:#18794e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3f6,#dfe8ed);font-family:Arial,sans-serif;color:#172a35;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 50px rgba(20,43,58,.12)}
.logo{width:58px;height:58px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;margin-bottom:16px}
h1{margin:0;font-size:24px;color:var(--navy)}
p{color:#687780;font-size:13px;line-height:1.5}
label{display:block;font-size:12px;font-weight:800;margin-top:15px}
input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #ccd7de;border-radius:9px;font:inherit;outline:none}
input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,43,58,.08)}
button{width:100%;margin-top:18px;border:0;border-radius:9px;padding:12px;background:var(--amber);color:#152c38;font-weight:900;font-size:14px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.message{display:none;margin-top:14px;padding:10px;border-radius:8px;font-size:12px}
.error{display:block;background:#fff0f0;border:1px solid #efc7c7;color:var(--red)}
.success{display:block;background:#eaf7ee;border:1px solid #b8ddc2;color:var(--green)}
.site{display:block;text-align:center;margin-top:16px;color:var(--navy);font-size:12px;text-decoration:none}
.small{font-size:11px;margin-top:18px;text-align:center;color:#87939c}
</style>
</head>
<body>
<section class="card">
  <div class="logo">GT</div>
  <h1>Admin Login</h1>
  <p>G TEC TECHNOLOGEIES — Product & Order Management</p>

  <form id="loginForm">
    <label>Username
      <input id="username" autocomplete="username" required autofocus>
    </label>

    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <button id="loginBtn" type="submit">LOGIN TO ADMIN</button>
    <div id="message" class="message"></div>
  </form>

  <a class="site" href="/">← Back to Website</a>
  <div class="small">Secure admin area</div>
</section>

<script>
const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const message=document.getElementById('message');

function show(text,type='error'){
  message.textContent=text;
  message.className='message '+type;
}

async function checkExistingSession(){
  const token=sessionStorage.getItem('gtec_admin_token');
  if(!token)return;

  try{
    const response=await fetch('/api/admin/me',{
      headers:{Authorization:'Bearer '+token}
    });

    if(response.ok){
      location.replace('/admin.html?panel=1');
      return;
    }
  }catch{}

  sessionStorage.removeItem('gtec_admin_token');
}

checkExistingSession();

form.addEventListener('submit',async event=>{
  event.preventDefault();
  btn.disabled=true;
  btn.textContent='LOGGING IN...';
  message.className='message';

  try{
    const response=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value.trim(),
        password:document.getElementById('password').value
      })
    });

    let data={};
    try{data=await response.json()}catch{}

    if(!response.ok){
      throw new Error(data.error||('Login failed (HTTP '+response.status+')'));
    }

    if(!data.token){
      throw new Error('Server did not return a login token.');
    }

    sessionStorage.setItem('gtec_admin_token',data.token);
    show('Login successful. Opening admin panel...','success');
    location.replace('/admin.html?panel=1');
  }catch(error){
    show(error.message||'Login failed. Please try again.','error');
    btn.disabled=false;
    btn.textContent='LOGIN TO ADMIN';
  }
});
</script>
</body>
</html>
